## 🔧 **KONFIGURATION**

**Alles wird in `conf/config.yaml` gesteuert:**

```yaml
# Features anpassen
features:
  type: mfcc  # oder: egemaps, mfcc+egemaps
  mfcc:
    n_mfcc: 20
    statistics: [mean, std, median, ...]

# Model anpassen
model:
  name: xgboost  # oder: lightgbm
  params:
    max_depth: 10
    learning_rate: 0.01
    n_estimators: 1000

# Training anpassen
training:
  cv_folds: 5
  use_class_weights: true  # Wichtig für Imbalance!
  tune_hyperparameters: false
  use_ensemble: false
```

**Parameter überschreiben:**
```bash
python -m sandcli.main command=train \
  model.params.max_depth=12 \
  training.cv_folds=10
```

---

## 🐛 **TROUBLESHOOTING**

### **Problem: Macro F1 steigt nicht (bleibt bei ~0.22)**

**Ursachen:**
1. ✅ **Features nicht neu extrahiert** → Lösung: Alte Features löschen
2. ✅ **Extremes Imbalance** → Lösung: SMOTE, Oversampling
3. ✅ **Zu wenig ALS_Severe Samples** → Lösung: Data Augmentation

**Sofort-Fix:**
```bash
# Lösche alte Features
rm -rf features/mfcc/train/*.npy features/mfcc/test/*.npy

# Neu extrahieren
python -m sandcli.main command=featurize

# Neu trainieren
python -m sandcli.main command=train
```

### **Problem: ALS_Severe F1 = 0.00**

Das ist **normal** bei nur 40 Samples vs. 680 Healthy!

**Lösungen:**
1. **SMOTE** (Synthetic Minority Oversampling)
2. **Focal Loss** (fokussiert auf schwere Klassen)
3. **Mehr Daten sammeln** (ideal)

