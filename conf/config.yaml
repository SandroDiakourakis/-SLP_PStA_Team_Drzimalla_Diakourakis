defaults:
  - _self_

# ============================================================================
# SAND TASK 1 - UNIFIED CONFIGURATION
# Alle Einstellungen an einem Ort!
# ============================================================================

# Command (wird über CLI gesetzt)
command: null

# Experiment
seed: 42
experiment_name: "sand_task1"
output_dir: "runs"

# ============================================================================
# DATA
# ============================================================================
data:
  root_dir: "data/task1/training"
  manifest_dir: "data/manifests"
  metadata_file: "data/task1/sand_task_1.xlsx"
  sample_rate: 8000
  tasks:
    - phonationA
    - phonationE
    - phonationI
    - phonationO
    - phonationU
    - rhythmKA
    - rhythmPA
    - rhythmTA

# ============================================================================
# LABELS
# ============================================================================
labels:
  num_classes: 5
  class_names:
    - "ALS_Severe (1)"
    - "ALS_Moderate (2)"
    - "ALS_Mild (3)"
    - "ALS_None (4)"
    - "Healthy (5)"
  label_mapping:
    1: "ALS_Severe (1)"
    2: "ALS_Moderate (2)"
    3: "ALS_Mild (3)"
    4: "ALS_None (4)"
    5: "Healthy (5)"

# ============================================================================
# SPLIT
# ============================================================================
split:
  test_size: 0.2
  stratify: true
  min_samples_per_subject: 1

# ============================================================================
# FEATURES
# ============================================================================
features:
  type: "mfcc"  # Options: mfcc, egemaps, mfcc+egemaps

  mfcc:
    n_mfcc: 20              # Anzahl MFCC Koeffizienten
    n_fft: 2048
    hop_length: 256
    n_mels: 80
    include_deltas: true
    include_delta_deltas: true
    statistics:             # Statistiken pro Feature
      - mean
      - std
      - min
      - max
      - median
      - q25
      - q75
      - iqr
      - skewness
      - kurtosis
      - rms
      - zcr

  egemaps:
    feature_set: "eGeMAPSv02"
    feature_level: "functionals"

# ============================================================================
# MODEL
# ============================================================================
model:
  name: "xgboost"  # Options: xgboost, lightgbm
  use_ensemble: false  # Kombiniert XGBoost + LightGBM + SVM

  params:
    objective: "multi:softmax"
    eval_metric: "mlogloss"
    max_depth: 10
    learning_rate: 0.01
    n_estimators: 1000
    subsample: 0.8
    colsample_bytree: 0.7
    min_child_weight: 1
    gamma: 0.2
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    tree_method: "hist"
    device: "cpu"

# ============================================================================
# TRAINING
# ============================================================================
training:
  cv_folds: 5
  early_stopping_rounds: 50
  use_class_weights: true        # WICHTIG für Imbalance!
  tune_hyperparameters: false    # GridSearch (1-2 Stunden)

  # SMOTE für Imbalance (experimentell)
  use_smote: false
  smote_k_neighbors: 5

  # Hyperparameter-Tuning Grid
  tuning_grid:
    max_depth: [8, 10, 12]
    learning_rate: [0.01, 0.03, 0.05]
    n_estimators: [500, 1000, 1500]
    min_child_weight: [1, 3, 5]
    gamma: [0.1, 0.2, 0.3]

# ============================================================================
# DEVICE & LOGGING
# ============================================================================
device: "mps"  # For M2 Max; use "cpu" as fallback
verbose: true
save_predictions: true
save_metrics: true
save_confusion_matrix: true
save_feature_importance: true
# 🚀 SAND Task 1 - Audio Classification Pipeline

Klassifizierung von Sprachaufnahmen von ALS-Patienten in 5 Schweregrade.

---

## 📋 **QUICK START**

```bash
# 1. Environment aktivieren
source venv/bin/activate

# 2. Daten vorbereiten (einmalig)
python -m sandcli.main command=prep
python -m sandcli.main command=split

# 3. Features extrahieren
python -m sandcli.main command=featurize

# 4. Modell trainieren
python -m sandcli.main command=train

# 5. (Optional) Hyperparameter-Tuning
python -m sandcli.main command=train training.tune_hyperparameters=true

# 6. (Optional) Ensemble
python -m sandcli.main command=train model.use_ensemble=true
```

---

