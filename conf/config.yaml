defaults:
  - _self_

# ============================================================================
# SAND TASK 1 - UNIFIED CONFIGURATION
# Alle Einstellungen an einem Ort!
# ============================================================================

# Command (wird über CLI gesetzt)
command: null

# Experiment
seed: 42
experiment_name: "sand_task1"
output_dir: "runs"

# ============================================================================
# DATA
# ============================================================================
data:
  root_dir: "data/task1/training"
  manifest_dir: "data/manifests"
  metadata_file: "data/task1/sand_task_1.xlsx"
  sample_rate: 8000
  tasks:
    - phonationA
    - phonationE
    - phonationI
    - phonationO
    - phonationU
    - rhythmKA
    - rhythmPA
    - rhythmTA

# ============================================================================
# LABELS
# ============================================================================
labels:
  num_classes: 5
  class_names:
    - "ALS_Severe (1)"
    - "ALS_Moderate (2)"
    - "ALS_Mild (3)"
    - "ALS_None (4)"
    - "Healthy (5)"
  label_mapping:
    1: "ALS_Severe (1)"
    2: "ALS_Moderate (2)"
    3: "ALS_Mild (3)"
    4: "ALS_None (4)"
    5: "Healthy (5)"

# ============================================================================
# SPLIT
# ============================================================================
split:
  test_size: 0.2
  stratify: true
  min_samples_per_subject: 1

# ============================================================================
# FEATURES
# ============================================================================
features:
  type: "mfcc"  # Options: mfcc, egemaps, mfcc+egemaps

  mfcc:
    n_mfcc: 20              # Anzahl MFCC Koeffizienten
    n_fft: 2048
    hop_length: 256
    n_mels: 80
    include_deltas: true
    include_delta_deltas: true
    statistics:             # Statistiken pro Feature
      - mean
      - std
      - min
      - max
      - median
      - q25
      - q75
      - iqr
      - skewness
      - kurtosis
      - rms
      - zcr

  egemaps:
    feature_set: "eGeMAPSv02"
    feature_level: "Functionals"  # Großbuchstabe F! opensmile ist case-sensitive

# ============================================================================
# MODEL
# ============================================================================
model:
  name: "xgboost"  # Options: xgboost, lightgbm
  use_ensemble: true  # Kombiniert XGBoost + LightGBM + SVM

  params:
    objective: "multi:softmax"
    eval_metric: "mlogloss"
    max_depth: 8               # Reduziert für weniger Overfitting
    learning_rate: 0.05        # Erhöht für schnelleres Lernen
    n_estimators: 2000         # Mehr Bäume für bessere Performance
    subsample: 0.7             # Mehr Regularisierung
    colsample_bytree: 0.6      # Mehr Regularisierung
    min_child_weight: 3        # Höher für bessere Generalisierung
    gamma: 0.3                 # Mehr Pruning
    reg_alpha: 0.5             # Stärkere L1 Regularisierung
    reg_lambda: 2.0            # Stärkere L2 Regularisierung
    scale_pos_weight: 2.0      # Extra Weight für Minority-Klassen
    random_state: 42
    tree_method: "hist"
    device: "cpu"

# ============================================================================
# TRAINING
# ============================================================================
training:
  cv_folds: 5
  early_stopping_rounds: 100     # Mehr Geduld
  use_class_weights: true        # WICHTIG für Imbalance!
  tune_hyperparameters: false    # GridSearch (1-2 Stunden)

  # SMOTE für Imbalance (experimentell)
  use_smote: true                # AKTIVIERT!
  smote_k_neighbors: 3           # Reduziert für kleine Klassen
  smote_sampling_strategy: "not majority"  # Nur Minority-Klassen übersamples

  # Hyperparameter-Tuning Grid (OPTIMIERT: 8 statt 243 Kombinationen!)
  tuning_grid:
    max_depth: [8, 10]              # 2 statt 3 Werte (current best ist 8)
    learning_rate: [0.05, 0.07]     # 2 statt 3 Werte (0.03 zu langsam)
    n_estimators: [2000]            # 1 statt 3 Werte (fixiert auf best)
    min_child_weight: [1, 3]        # 2 statt 3 Werte (REDUZIERT: 1 statt 3 für kleine Klassen!)
    gamma: [0.3]                    # 1 statt 3 Werte (fixiert auf best)

# ============================================================================
# DEVICE & LOGGING
# ============================================================================
device: "mps"  # For M2 Max; use "cpu" as fallback
verbose: true
save_predictions: true
save_metrics: true
save_confusion_matrix: true
save_feature_importance: true
