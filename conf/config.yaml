## 📊 **DATEN-ÜBERSICHT**

### **Klassen & Samples:**
```
Healthy (5):      680 samples (39%)
ALS_None (4):     488 samples (28%)
ALS_Mild (3):     360 samples (21%)
ALS_Moderate (2): 168 samples (10%)
ALS_Severe (1):    40 samples (2%)  ← PROBLEM: Sehr wenig!
-----------------------------------
TOTAL:           1736 samples

Imbalance Ratio: 17:1 (Healthy vs ALS_Severe)
```

**⚠️ WICHTIG:** Das extreme Imbalance (17:1) macht ALS_Severe fast unmöglich zu lernen!

---

## 🔍 **PIPELINE SCHRITTE (DETAILS)**

### **Schritt 1: Data Preparation**
```bash
python -m sandcli.main command=prep
```
- Scannt alle WAV-Dateien in `data/task1/training/`
- Extrahiert Metadaten (Subject ID, Task, Dauer)
- Lädt Labels aus Excel (`sand_task_1.xlsx`)
- Erstellt `data/manifests/full_manifest.csv`

**Output:** ~2176 Audio-Dateien gefunden

---

### **Schritt 2: Train/Test Split**
```bash
python -m sandcli.main command=split
```
- **Subject-wise Split** (kein Subject in Train UND Test)
- 80% Train, 20% Test
- Stratified by Label (versucht Balance zu halten)

**Output:**
- `train_manifest.csv`: 1736 samples
- `test_manifest.csv`: 440 samples

---

### **Schritt 3: Feature Extraction**
```bash
python -m sandcli.main command=featurize
```

**Standard Features (MFCC):**
- 20 MFCCs (statt 13)
- 80 Mel-Bins
- Deltas + Delta-Deltas
- 12 Statistiken: mean, std, min, max, median, q25, q75, IQR, skewness, kurtosis, RMS, ZCR

**Resultat:** ~720 Features pro Audio-Datei

**Alternative Features:**
```bash
# eGeMAPS (akustische Features)
python -m sandcli.main command=featurize features.type=egemaps

# Fusion (MFCC + eGeMAPS)
python -m sandcli.main command=featurize features.type=mfcc+egemaps
```

---

### **Schritt 4: Training**
```bash
python -m sandcli.main command=train
```

**Standard Training:**
- Model: XGBoost
- Class Weighting: Automatisch (handled Imbalance)
- Cross-Validation: 5-Fold
- Early Stopping: 50 rounds

**Mit Hyperparameter-Tuning:**
```bash
python -m sandcli.main command=train training.tune_hyperparameters=true
```
- GridSearch über wichtige Parameter
- Optimiert für Macro F1
- Dauer: ~1-2 Stunden

**Mit Ensemble:**
```bash
python -m sandcli.main command=train model.use_ensemble=true
```
- Kombiniert XGBoost + LightGBM + SVM
- Soft Voting (nutzt Wahrscheinlichkeiten)
- Bessere Generalisierung

---

## 📈 **ERWARTETE PERFORMANCE**

### **Baseline (MFCC + XGBoost):**
```
Macro F1:  0.22 (sehr schlecht!)
Accuracy:  0.33
Problem:   ALS_Severe wird nicht erkannt (0.00 F1)
```

### **Nach Optimierungen:**
```
Macro F1:  0.45-0.55 (mit besseren Features + Class Weighting)
Accuracy:  0.50-0.60
Macro F1:  0.55-0.65 (+ Hyperparameter Tuning)
Macro F1:  0.60-0.70 (+ Ensemble)
```

**Wichtig:** ALS_Severe (nur 40 Samples!) wird immer schwierig bleiben.

