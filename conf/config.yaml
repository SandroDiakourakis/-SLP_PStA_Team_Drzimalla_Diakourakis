## ❓ **FAQ**

**Q: Warum so viele Config-Dateien?**
A: Nur `config.yaml` wird gebraucht! Die anderen sind veraltet.

**Q: Brauche ich die Shell-Skripte?**
A: NEIN! Alles läuft über `python -m sandcli.main command=...`

**Q: Warum ist ALS_Severe F1 = 0?**
A: Nur 40 Samples vs. 680 Healthy. Das ist extremes Imbalance.

**Q: Wie kann ich das verbessern?**
A: SMOTE, Focal Loss, oder mehr Daten sammeln.

