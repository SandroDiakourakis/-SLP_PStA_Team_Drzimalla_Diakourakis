---

## 🎯 **NÄCHSTE SCHRITTE**

### **Wenn Macro F1 < 0.50:**
1. Überprüfe ob Features korrekt extrahiert wurden
2. Aktiviere Hyperparameter-Tuning
3. Versuche Ensemble

### **Wenn Macro F1 0.50-0.60:**
1. Versuche SMOTE für Imbalance
2. Teste eGeMAPS Features
3. Teste Feature Fusion (MFCC+eGeMAPS)

### **Wenn Macro F1 > 0.60:**
1. 🎉 Gut! Optimiere weiter mit:
   - Deep Learning (Wav2Vec2)
   - Data Augmentation
   - Model Stacking

