defaults:
  - config

experiment_name: "ssl_wavlm_base"

# Model
model:
  name: "wavlm"
  backbone: "microsoft/wavlm-base"
  freeze_backbone: false  # Set true for feature extraction only
  pooling: "mean"
  classifier:
    hidden_dim: 256
    dropout: 0.3
    num_layers: 2

# Training
training:
  batch_size: 16
  num_epochs: 50
  learning_rate: 1e-4
  backbone_lr: 1e-5  # Lower LR for pretrained backbone
  weight_decay: 0.01
  warmup_steps: 500
  optimizer: "adamw"
  scheduler: "cosine"

  # Loss
  loss: "weighted_ce"  # or "focal"
  focal_alpha: 0.25
  focal_gamma: 2.0

  # Regularization
  gradient_clip: 1.0
  early_stopping_patience: 10

# Data Loading
data_loader:
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

# Augmentation (optional)
augmentation:
  enabled: false
  time_stretch: [0.9, 1.1]
  pitch_shift: [-2, 2]
  noise_snr: [15, 30]

# Evaluation
evaluation:
  primary_metric: "macro_f1"
  save_confusion_matrix: true
  save_embeddings: true
  batch_size: 32