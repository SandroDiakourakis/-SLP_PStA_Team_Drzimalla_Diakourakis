defaults:
  - config

command: null
experiment_name: "improved_features"

# VERBESSERTE FEATURES
features:
  type: "mfcc"
  mfcc:
    n_mfcc: 20
    n_fft: 2048
    hop_length: 256
    n_mels: 80
    include_deltas: true
    include_delta_deltas: true
    statistics:
      - mean
      - std
      - min
      - max
      - median
      - q25
      - q75
      - iqr
      - skewness
      - kurtosis
      - rms
      - zcr
  egemaps:
    feature_set: "eGeMAPSv02"
    feature_level: "functionals"

# MODEL mit KLASSEN-BALANCING
model:
  name: "xgboost"
  params:
    objective: "multi:softmax"
    eval_metric: "mlogloss"
    max_depth: 10
    learning_rate: 0.01
    n_estimators: 1000
    subsample: 0.8
    colsample_bytree: 0.7
    min_child_weight: 1
    gamma: 0.2
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    tree_method: "hist"
    device: "cpu"

# WICHTIG: Sample Weighting für Imbalance
training:
  cv_folds: 5
  early_stopping_rounds: 50
  use_class_weights: true

